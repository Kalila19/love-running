<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Love Running. Club for runners in Dubin, Irelan. Urban running, trail running. Dublin docklands and Phoenix Park"
    />
    <meta
      name="keywords"
      content="love running, run, running club, runners, Ireland, Dublin, sport, exercise"
    />
    <title>Love Running</title>
    <!--Favicon-->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/favicon/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="assets/favicon/favicon-16x16.png"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Lato:wght@300&family=Oswald:wght@200..700&display=swap");
    </style>
  </head>
  <body>
    <!--Header-->
    <header>
      <a href="signup.html">
        <h1 id="logo">Love Running</h1>
      </a>
      <input type="checkbox" id="nav-toggle" name="nav-toggle">
      <label for="nav-toggle" class="nav-toggle-label"><i class="fa-solid fa-bars"></i></label>
      <nav>
        <ul id="menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="signup.html"class="active">Sign Up</a></li>
        </ul>
      </nav>
    </header>

    <!--Main Content-->
    <main>
      <section id="signup">
        <form action="https://formdump.codeinstitute.net" id="signup-form" method="post">
          <h2><i class="fa-solid fa-heart-pulse"></i> Let's get you signed up!</h2>
          <label for="first-name">First Name</label>  <!-- each input must have a corresponding label -->
          <input type="text" id="first-name" name="first-name" class="text-input" required>  <!-- without the name attribute data from the form will not be submitted -->
          <br>
          <label for="last-name">Last Name</label>
          <input type="text" id="last-name" name="last-name" class="text-input" required>
          <br>
          <label for="email-address">Email Address</label>
          <input type="email" id="email-address" name="email-address" class="text-input" required>
          <br>
          <div class="radio-buttons"> 
            <!-- one of the buttons needs to be checked -->
            <div><label for="road">Road</label> <input type="radio" name="running-preference" id="road" value="road" required checked></div>
            <br>
            <div><label for="trail">Trail</label> <input type="radio" name="running-preference" id="trail" value="trail" required></div>
            <br>
            <div><label for="both">Both</label> <input type="radio" name="running-preference" id="both" value="both" required></div>
          </div>
          <br>
          <button type="submit" class="join-button">Let's Run!</button>
        </form>
      </section>
    </main>
    <!--Footer-->
    <footer>
      <ul id="social-networks">
        <li><a href="https://www.facebook.com" target="_blank" rel="noopener" 
          aria-label="Visit our facebook page (opens in a new tab)"><i class="fa-brands fa-facebook"></i></li>
        <li><a href="https://www.twitter.com" target="_blank" rel="noopener" 
          aria-label="Visit our twitter page (opens in a new tab)"><i class="fa-brands fa-twitter"></i></li>
        <li><a href="https://www.youtube.com" target="_blank" rel="noopener" 
          aria-label="Visit our youtube page (opens in a new tab)"><i class="fa-brands fa-youtube"></i></li>
        <li><a href="https://www.instagram.com" target="_blank" rel="noopener" 
          aria-label="Visit our instagram page (opens in a new tab)"><i class="fa-brands fa-instagram"></i></li>
      </ul>

    </footer>
    <!-- Font Awesome kit -->
     <script src="https://kit.fontawesome.com/b3def77d97.js" crossorigin="anonymous"></script>
  </body>
</html>
